[package]
name = "tinkoff-invest"
version = "3.0.0"
authors = ["WatchDG <baranov@w3m.co>"]
license = "MIT OR Apache-2.0"
description = "tinkoff invest library"
homepage = "https://github.com/WatchDG/rust-tinkoff-invest"
documentation = "https://docs.rs/tinkoff-invest"
repository = "https://github.com/WatchDG/rust-tinkoff-invest"
readme = "README.md"
edition = "2024"
exclude = [
    ".github",
    ".vs",
    "src/main.rs",
    ".gitignore"
]

[features]
default = ["users", "instruments", "market-data", "operations", "orders"]
users = []
instruments = []
market-data = []
operations = []
orders = []
streams = ["tokio/sync", "dep:tokio-stream"]
# Включает интеграционные тесты (нужен TINKOFF_INVEST_TOKEN).
integration-tests = []

[dependencies]
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "gzip"] }
tinkoff-invest-types = { version = "2.25" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", optional = true }
uuid = { version = "1.24", features = ["v7"] }
chrono = { version = "0.4" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[[example]]
name = "market_data_stream"
required-features = ["streams"]
